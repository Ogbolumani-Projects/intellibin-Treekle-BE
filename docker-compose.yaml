services:
  web:
    build:
      context: .
    volumes:
      - .:/app 
    working_dir: /app  
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    # depends_on:
    #   - db
    environment:
      # - DJANGO_SETTINGS_MODULE=intellibin_api.settings 
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=intellibin_db
      - DB_USER=intellibin
      - DB_PASSWORD=intellibin

  db:
    image: mysql:8.0
    restart: always
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=YourStrongPassword
      - MYSQL_DATABASE=intellibin_db
      - MYSQL_USER=intellibin
      - MYSQL_PASSWORD=intellibin

volumes:
  mysql_data: